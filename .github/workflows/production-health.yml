name: FundLenz production health
on:
  push:
    branches: [main]
    paths:
      - 'scripts/automation/health.py'
      - '.github/workflows/production-health.yml'
      - 'automation/runtime.json'
  schedule:
    - cron: '23 7,19 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: fundlenz-production-health
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify daily schedule, exact live release, pages and redirects
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/automation/health.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fundlenz-health
          path: work/health.json
          retention-days: 30
          if-no-files-found: error
